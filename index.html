<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>美容院 POS</title>
<meta name="theme-color" content="#b83b6e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="styles.css">
</head>
<body class="locked">
<section id="login">
  <form id="loginForm" class="login-card">
    <img src="icons/icon-192.png" alt="" width="72" height="72">
    <h1>美容院 POS</h1>
    <p class="muted">请登入以继续</p>
    <label>登入 ID<input name="id" type="email" autocomplete="username" required autofocus></label>
    <label>密码<input name="pw" type="password" autocomplete="current-password" required></label>
    <label class="check"><input name="remember" type="checkbox" checked> 在这台设备保持登入</label>
    <p id="loginErr" class="err" role="alert"></p>
    <button class="btn primary" type="submit">登入</button>
  </form>
</section>
<header class="top"><h1 id="title">美容院 POS</h1></header>
<main id="view"></main>
<nav class="tabs">
  <button data-act="tab" data-tab="cal"><span>📅</span>预约</button>
  <button data-act="tab" data-tab="cust"><span>👤</span>顾客</button>
  <button data-act="tab" data-tab="sales"><span>💳</span>收款</button>
  <button data-act="tab" data-tab="prod"><span>📦</span>产品<b id="lowBadge" class="nb" hidden></b></button>
  <button data-act="tab" data-tab="set"><span>⚙️</span>设置</button>
</nav>
<dialog id="sheet"></dialog>
<div id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
